name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the APK to a release on v* tags

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Release signing: the KEYSTORE_* secrets when present, otherwise the debug key (still installable).
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SPILL_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      # On a tag (v2.0.0) the app takes its version from it; the build number is the run number.
      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "ORG_GRADLE_PROJECT_versionName=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_versionCode=${{ github.run_number }}" >> "$GITHUB_ENV"

      # Tests fail the build if any card or deck is missing a language or breaks the Drink counts.
      - run: ./gradlew testDebugUnitTest assembleRelease
        env:
          SPILL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPILL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPILL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - run: mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk dist/Spill.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Spill-Android
          path: dist/Spill.apk

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Spill.apk
